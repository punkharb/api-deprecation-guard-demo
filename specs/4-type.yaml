# Scenario 4: developer changes `total` from number to string
# (e.g. to send "1,250.00 THB"). Same field name, different type.
openapi: 3.0.3
info: {title: Shop API, version: 2.0.0}
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  phone: {type: string}
                  email: {type: string}
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    orderId: {type: string}
                    total: {type: string}
