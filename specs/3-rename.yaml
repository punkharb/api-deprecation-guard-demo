# Scenario 3: developer renames `phone` -> `phoneNumber`.
# To a spec-diff tool this looks like "phone removed" + "phoneNumber added".
openapi: 3.0.3
info: {title: Shop API, version: 2.0.0}
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  name: {type: string}
                  phoneNumber: {type: string}
                  email: {type: string}
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    orderId: {type: string}
                    total: {type: number}
